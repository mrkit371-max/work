<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f97316" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="./icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="description" content="Календарь тренировок: планируйте, выполняйте и отслеживайте прогресс" />
  <link rel="stylesheet" href="./styles.css?pwa=14" />
  <title>Календарь тренировок</title>
</head>
<body>
  <main id="app"></main>

  <div id="modalHost" hidden></div>

  <div class="confirm-host" id="confirmHost" hidden>
    <div class="confirm-backdrop" id="confirmBackdrop"></div>
    <div class="confirm-box" role="alertdialog" aria-modal="true">
      <div class="confirm-title" id="confirmTitle">Удалить?</div>
      <div class="confirm-text" id="confirmText"></div>
      <div class="confirm-actions">
        <button class="btn subtle" id="confirmNo">Отмена</button>
        <button class="btn danger" id="confirmYes">Удалить</button>
      </div>
    </div>
  </div>

  <footer class="uni">
    <div class="uni-inner" id="uniNav">
      <button class="uni-btn" data-view="calendar"><span class="uni-ico">📅</span>Календарь</button>
      <button class="uni-btn" data-view="library"><span class="uni-ico">💪</span>Упражнения</button>
      <button class="uni-btn" data-view="progress"><span class="uni-ico">📈</span>Прогресс</button>
      <button class="uni-btn" data-view="settings"><span class="uni-ico">⚙️</span>Профиль</button>
    </div>
  </footer>

  <div class="a2hs" id="a2hs" hidden>
    <span>📲 Установите приложение на телефон</span>
    <button class="btn tiny" id="a2hsInstall">Установить</button>
    <button class="uni-x" id="a2hsClose" aria-label="Закрыть">✕</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/13.3.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/13.3.0/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore-compat.js" defer></script>
  <script src="./firebase-config.js?v=2" defer></script>
  <script src="./firebase.js?v=5" defer></script>
  <script src="./app.js?v=40" defer></script>
</body>
</html>
